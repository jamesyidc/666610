<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支撑压力线系统测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e2139;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: #2a2d4a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #2a2d4a;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #4CAF50;
        }
        .stat-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .data-table {
            background: #2a2d4a;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #444;
        }
        th {
            background: #1e2139;
            font-weight: bold;
        }
        .success {
            color: #4CAF50;
        }
        .error {
            color: #f44336;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 支撑压力线系统 - 数据导入验证</h1>
            <p>测试独立数据库 support_resistance.db 功能</p>
        </div>

        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-label">数据库状态</div>
                <div class="stat-value" id="db-status">加载中...</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总记录数</div>
                <div class="stat-value" id="total-records">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">最新数据时间</div>
                <div class="stat-value" style="font-size: 16px;" id="latest-time">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">币种数量</div>
                <div class="stat-value" id="coin-count">-</div>
            </div>
        </div>

        <div class="data-table">
            <h2>最新支撑压力线数据</h2>
            <div id="data-content">
                <div class="loading">正在加载数据...</div>
            </div>
        </div>
    </div>

    <script>
        // 获取统计信息
        fetch('/api/support-resistance/stats')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('db-status').innerHTML = '<span class="success">✅ 正常</span>';
                    document.getElementById('total-records').textContent = data.total_records.toLocaleString();
                    document.getElementById('latest-time').textContent = data.max_time;
                    document.getElementById('coin-count').textContent = data.symbols.length;
                } else {
                    document.getElementById('db-status').innerHTML = '<span class="error">❌ 错误</span>';
                }
            })
            .catch(err => {
                document.getElementById('db-status').innerHTML = '<span class="error">❌ 连接失败</span>';
            });

        // 获取最新数据
        fetch('/api/support-resistance/latest')
            .then(res => res.json())
            .then(data => {
                const content = document.getElementById('data-content');
                
                if (data.success && data.data && data.data.length > 0) {
                    let html = `
                        <p><strong>数据时间:</strong> ${data.latest_time}</p>
                        <p><strong>币种总数:</strong> ${data.total_coins}</p>
                        <table>
                            <thead>
                                <tr>
                                    <th>币种</th>
                                    <th>当前价</th>
                                    <th>支撑线1</th>
                                    <th>支撑线2</th>
                                    <th>压力线1</th>
                                    <th>压力线2</th>
                                    <th>场景</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    data.data.slice(0, 10).forEach(item => {
                        html += `
                            <tr>
                                <td><strong>${item.symbol}</strong></td>
                                <td>${item.current_price || '-'}</td>
                                <td>${item.support_line_1 || '-'}</td>
                                <td>${item.support_line_2 || '-'}</td>
                                <td>${item.resistance_line_1 || '-'}</td>
                                <td>${item.resistance_line_2 || '-'}</td>
                                <td>${item.alert_scenario || '正常'}</td>
                            </tr>
                        `;
                    });
                    
                    html += '</tbody></table>';
                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<p class="error">❌ 没有数据或加载失败</p>';
                }
            })
            .catch(err => {
                document.getElementById('data-content').innerHTML = '<p class="error">❌ 加载失败: ' + err.message + '</p>';
            });
    </script>
</body>
</html>
